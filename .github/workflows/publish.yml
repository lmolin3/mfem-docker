name: Publish images

on:
  push:
    branches: [main]
    paths:
      - 'docker-bake.hcl'
      - 'toolchain/**'
      - 'cuda-base/**'
      - 'cpu-tpls/**'
      - 'cpu-tpls-debug/**'
      - 'cpu-tpls-vscode/**'
      - 'gpu-tpls/**'
      - '.github/workflows/publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker-bake.hcl'
      - 'toolchain/**'
      - 'cuda-base/**'
      - 'cpu-tpls/**'
      - 'cpu-tpls-debug/**'
      - 'cpu-tpls-vscode/**'
      - 'gpu-tpls/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Detect which components changed ─────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.filter.outputs.bases }}
      cpu:   ${{ steps.filter.outputs.cpu }}
      gpu:   ${{ steps.filter.outputs.gpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bases:
              - 'docker-bake.hcl'
              - 'toolchain/**'
              - 'cuda-base/**'
              - '.github/workflows/publish.yml'
            cpu:
              - 'docker-bake.hcl'
              - 'toolchain/**'
              - 'cpu-tpls/**'
              - 'cpu-tpls-debug/**'
              - 'cpu-tpls-vscode/**'
              - '.github/workflows/publish.yml'
            gpu:
              - 'docker-bake.hcl'
              - 'cuda-base/**'
              - 'gpu-tpls/**'
              - '.github/workflows/publish.yml'

  # ── Stage 1a: toolchain (multi-platform: amd64 + arm64) ─────────────────────
  toolchain:
    needs: changes
    if: needs.changes.outputs.bases == 'true' || github.event_name == 'workflow_dispatch'
    name: Build toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/bake-action@v5
        with:
          workdir: .
          targets: toolchain
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha,scope=toolchain-amd64
            *.cache-from=type=gha,scope=toolchain-arm64
            *.cache-to=type=gha,mode=max,scope=toolchain-amd64
            *.platform=linux/amd64,linux/arm64

  # ── Stage 1b: cuda-base (amd64 only — no ARM64 CUDA upstream) ───────────────
  cuda-base:
    needs: changes
    if: needs.changes.outputs.bases == 'true' || github.event_name == 'workflow_dispatch'
    name: Build cuda-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/bake-action@v5
        with:
          workdir: .
          targets: cuda-base
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha,scope=cuda-base
            *.cache-to=type=gha,mode=max,scope=cuda-base
            *.platform=linux/amd64

  # ── Stage 2a: cpu-tpls (base, must build first) ──────────────────────────────
  cpu-tpls:
    needs: [changes, toolchain]
    if: |
      (needs.changes.outputs.cpu == 'true' || github.event_name == 'workflow_dispatch') &&
      !failure() && !cancelled()
    name: Build cpu-tpls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/bake-action@v5
        with:
          workdir: .
          targets: cpu-tpls
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha,scope=cpu-tpls-amd64
            *.cache-from=type=gha,scope=cpu-tpls-arm64
            *.cache-to=type=gha,mode=max,scope=cpu-tpls-amd64
            *.platform=linux/amd64,linux/arm64

  # ── Stage 2b: cpu-tpls-debug and cpu-tpls-vscode (depend on cpu-tpls) ────────
  cpu-tpls-variants:
    needs: [changes, cpu-tpls]
    if: |
      (needs.changes.outputs.cpu == 'true' || github.event_name == 'workflow_dispatch') &&
      !failure() && !cancelled()
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [cpu-tpls-debug, cpu-tpls-vscode]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/bake-action@v5
        with:
          workdir: .
          targets: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}-amd64
            *.cache-from=type=gha,scope=${{ matrix.target }}-arm64
            *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}-amd64
            *.platform=linux/amd64,linux/arm64

  # ── Stage 2c: GPU images (amd64 only — CUDA is x86) ─────────────────────────
  gpu:
    needs: [changes, cuda-base]
    if: |
      (needs.changes.outputs.gpu == 'true' || github.event_name == 'workflow_dispatch') &&
      !failure() && !cancelled()
    name: Build gpu-tpls-sm${{ matrix.sm }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sm: ["80", "90", "120"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/bake-action@v5
        with:
          workdir: .
          targets: gpu-tpls-sm${{ matrix.sm }}
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha,scope=gpu-tpls-sm${{ matrix.sm }}
            *.cache-to=type=gha,mode=max,scope=gpu-tpls-sm${{ matrix.sm }}
            *.platform=linux/amd64

  # ── Stage 3: Cleanup old package versions ───────────────────────────────────
  cleanup:
    needs: [toolchain, cuda-base, cpu-tpls, cpu-tpls-variants, gpu]
    if: github.event_name != 'pull_request' && !failure() && !cancelled()
    name: Cleanup ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - toolchain
          - cuda-base
          - cpu-tpls
          - cpu-tpls-debug
          - cpu-tpls-vscode
          - gpu-tpls-sm80
          - gpu-tpls-sm90
          - gpu-tpls-sm120
    steps:
      - name: Delete old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="${{ matrix.package }}"

          OWNER_TYPE=$(gh api "/users/${OWNER}" --jq '.type')
          if [ "$OWNER_TYPE" = "Organization" ]; then
            BASE="/orgs/${OWNER}/packages/container/${PACKAGE}"
          else
            BASE="/user/packages/container/${PACKAGE}"
          fi

          IDS=$(gh api "${BASE}/versions" \
            --jq 'sort_by(.created_at) | reverse | .[3:][].id' 2>/dev/null) \
            || { echo "Package ${PACKAGE} not found, skipping."; exit 0; }

          [ -z "$IDS" ] && { echo "No old versions to delete for ${PACKAGE}."; exit 0; }

          for id in $IDS; do
            gh api --method DELETE "${BASE}/versions/${id}"
            echo "Deleted version ${id} of ${PACKAGE}."
          done
